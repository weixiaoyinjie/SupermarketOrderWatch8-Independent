name: Build Independent OrderReminder Phone+Watch8

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate project (supports single ZIP upload)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle && -d app && -d wear ]]; then
            echo "PROJECT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            mapfile -t zips < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*Order*Source*.zip' | sort)
            if [[ ${#zips[@]} -ne 1 ]]; then
              echo 'ERROR: upload exactly one *Order*Source*.zip, or upload extracted source tree'
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/order-reminder-sync"
            unzip -q "${zips[0]}" -d "$RUNNER_TEMP/order-reminder-sync"
            [[ -f "$RUNNER_TEMP/order-reminder-sync/settings.gradle" ]] || { echo 'ERROR: missing settings.gradle'; exit 1; }
            echo "PROJECT=$RUNNER_TEMP/order-reminder-sync" >> "$GITHUB_ENV"
          fi
      - name: Build both APKs together (one signing certificate)
        run: gradle --no-daemon --stacktrace --project-dir "$PROJECT" :app:assembleDebug :wear:assembleDebug
      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Independent-OrderReminder-Phone-v3
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Watch 8 APK
        uses: actions/upload-artifact@v4
        with:
          name: Independent-OrderReminder-Watch8-v3
          path: ${{ env.PROJECT }}/wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
